## ═══════════════════════════════════════════════════════════════
## openvibe.wiki — Nginx Configuration (REFERENCE)
##
## Deployed to /etc/nginx/sites-available/openvibe.wiki.conf — keep them in sync and reload
## nginx after changing it. Live since 2026-09-23 (the launch release removed openvibe.wiki from
## OpenVibe.Sites/sites.json).
##
## The Node app (port 4800, systemd unit openvibe-wiki) renders every page. nginx terminates
## TLS, redirects www → apex, rate-limits auth, API and form posts, and never caches anything
## itself: Wiki's Cache-Control decides (public, max-age=60 only for anonymous views of public
## pages; private, no-store for everything else).
## ═══════════════════════════════════════════════════════════════

limit_req_zone $binary_remote_addr zone=ovwiki_api:10m rate=10r/s;
limit_req_zone $binary_remote_addr zone=ovwiki_auth:10m rate=10r/m;
# Form posts only (reads are not limited here): an empty key is not counted.
map $request_method $ovwiki_write_key { default ""; POST $binary_remote_addr; }
limit_req_zone $ovwiki_write_key zone=ovwiki_write:10m rate=30r/m;

# ── HTTP → HTTPS redirect ──────────────────────────────────
server {
    listen 80;
    listen [::]:80;
    server_name openvibe.wiki www.openvibe.wiki;

    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://openvibe.wiki$request_uri; }
}

# ── www → apex ─────────────────────────────────────────────
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name www.openvibe.wiki;

    ssl_certificate     /etc/letsencrypt/live/openvibe.wiki/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/openvibe.wiki/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;

    return 301 https://openvibe.wiki$request_uri;
}

# ── HTTPS server ───────────────────────────────────────────
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name openvibe.wiki;

    ssl_certificate     /etc/letsencrypt/live/openvibe.wiki/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/openvibe.wiki/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;

    access_log /var/log/nginx/openvibe.wiki.access.log;
    error_log  /var/log/nginx/openvibe.wiki.error.log;

    # Pages are at most 200 000 characters; the API accepts 512 KB JSON bodies.
    client_max_body_size 1m;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    gzip on;
    gzip_proxied any;
    gzip_vary on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types text/css application/javascript text/javascript application/json application/feed+json application/atom+xml image/svg+xml text/plain application/xml text/xml;

    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header CF-Connecting-IP $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    # Never let a shared cache here hold a personalised or private answer.
    proxy_no_cache 1;
    proxy_cache_bypass 1;

    # Prometheus metrics are for the host only (the app also refuses non-loopback callers).
    location = /metrics { return 404; }

    location /auth/ {
        limit_req zone=ovwiki_auth burst=10 nodelay;
        proxy_pass http://127.0.0.1:4800;
    }

    location /api/ {
        limit_req zone=ovwiki_api burst=40 nodelay;
        proxy_pass http://127.0.0.1:4800;
    }

    # Space imports (server/wiki/import.js): a JSON bundle of up to 2 MB, or the same bundle pasted
    # into the form (URL-encoded, the app accepts up to 6 MB there). The app also allows only 20
    # imports an hour per address. Regex locations win over the /api/ and / prefixes above and below.
    location ~ ^/api/v1/spaces/[^/]+/import$ {
        client_max_body_size 3m;
        limit_req zone=ovwiki_api burst=40 nodelay;
        proxy_pass http://127.0.0.1:4800;
    }
    location ~ ^/s/[^/]+/import$ {
        client_max_body_size 7m;
        limit_req zone=ovwiki_write burst=20 nodelay;
        proxy_pass http://127.0.0.1:4800;
    }

    location / {
        limit_req zone=ovwiki_write burst=20 nodelay;
        proxy_pass http://127.0.0.1:4800;
    }
}
